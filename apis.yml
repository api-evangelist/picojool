name: PicoJool
description: 'PicoJool is an optical connectivity company building Vertical Cavity Surface Emitting Lasers
  (VCSELs) and optical engines for AI and cloud data-center infrastructure. Its 50G NRZ, 100G PAM4, and
  200G PAM4 VCSEL arrays target 800G and 1.6T transceivers for PCIe, Ethernet, and InfiniBand, aiming to
  raise bandwidth density and cut the power cost of moving data across hyperscale AI clusters. Founded in
  2024 and based in Palo Alto, California, PicoJool emerged from stealth in November 2025 with $12M led by
  Playground Global. It is a semiconductor/photonics hardware company with no public API or developer
  platform; this profile is maintained by the API Evangelist network for portfolio and market tracking.'
